<script>
"use strict";
const G=10,C=["#e74c3c","#2ecc71","#3498db","#f1c40f"],$=s=>document.querySelector(s);
const TH={klasik:{p:0,st:"roll"},binatang:{p:5000,st:"walk",e:["🦊","🐸","🐟","🐥"]},tanaman:{p:5000,st:"jump",e:["🌹","🌵","🌸","🌻"]}};
const BG={standar:{p:0,a:"#d2b48a",b:"#80593a",f:"#5c3d26",s:"#3a3028"},grass:{p:5000,a:"#6cb64c",b:"#5aa242",f:"#8f6438",s:"#7ccf70"},land:{p:5000,a:"#c8a26e",b:"#b99462",f:"#7a6e60",s:"#a8794a"},cloud:{p:5000,a:"#f4f8ff",b:"#dce9fb",f:"#c3d4ee",s:"#8ec5ff"}};
const SP={slow:{m:1.7,h:850,cap:7500},medium:{m:1,h:550,cap:4400},fast:{m:.55,h:350,cap:2400}};
const BASE={roll:170,walk:260,jump:330};
const TT={
id:{title:"Bola Warna",lg_name:"Nama pemain",lg_pw:"Password",lg_in:"Masuk",lg_reg:"Daftar akun baru",e_user:"Nama 3-16 karakter (huruf, angka, _).",e_pass:"Password minimal 4 karakter.",e_taken:"Nama sudah dipakai di perangkat ini.",e_login:"Nama atau password salah.",lo:"Keluar akun",lg_note:"Akun dan password hanya tersimpan di perangkat ini dan tidak dikirim ke mana pun.",lb:"Peringkat",lbh:"Papan Peringkat",lbn:"Peringkat bersama hanya aktif saat halaman dibuka lewat link Claude. Di sini hanya rekor di perangkat ini.",lbe:"Belum ada skor.",lbw:"Memuat…",score:"Skor",best:"Rekor",bal:"Saldo",pl:"Pemain",next:"Berikutnya",shop:"Toko",set:"Setelan",again:"Ulang",start:"Ketuk bola, lalu ketuk kotak tujuan.",target:"Arahkan ke kotak tujuan, lalu klik.",target2:"Ketuk kotak tujuan untuk melihat lintasan.",tapgo:"Ketuk tujuan yang sama lagi untuk berjalan.",nopath:"Tidak ada jalan kosong ke sana!",pop:(n,g)=>"Pecah "+n+" bola! +"+g+" poin",nt:"Giliran berikutnya.",full:"Papan penuh!",steps:n=>n+" langkah",over:"GAME OVER",rec:"Rekor baru!",play:"Main lagi",tb:"Tampilan Bola",tg:"Latar Papan",use:"Pakai",buy:p=>"Beli "+p,inuse:"Dipakai",owned:"Dimiliki",price:p=>"Harga: "+p+" poin",poor:"Saldo kurang.",bought:"Berhasil dibeli!",name:"Nama pemain",speed:"Kecepatan gerak bola",slow:"Lambat",medium:"Sedang",fast:"Cepat",lang:"Bahasa",snd:"Suara",on:"Nyala",off:"Mati",close:"Tutup",note:"Membeli mengurangi saldo. Rekor tidak berubah.",local:"Data tersimpan di perangkat ini saja.",n_klasik:"Bola Klasik",n_binatang:"Seri Binatang",n_tanaman:"Seri Tanaman",n_standar:"Papan Standar",n_grass:"Rumput",n_land:"Tanah",n_cloud:"Awan",roll:"bergulir",walk:"berjalan",jump:"melompat",def:"Pemain"},
en:{title:"Color Balls",lg_name:"Player name",lg_pw:"Password",lg_in:"Log in",lg_reg:"Create account",e_user:"Name: 3-16 characters (letters, digits, _).",e_pass:"Password must be at least 4 characters.",e_taken:"That name is already used on this device.",e_login:"Wrong name or password.",lo:"Log out",lg_note:"Accounts and passwords are stored only on this device and are never sent anywhere.",lb:"Ranking",lbh:"Shared Ranking",lbn:"The shared ranking only works when the page is opened through the Claude link. Here you only see this device’s best score.",lbe:"No scores yet.",lbw:"Loading…",score:"Score",best:"Best",bal:"Balance",pl:"Player",next:"Next",shop:"Shop",set:"Settings",again:"Restart",start:"Tap a ball, then tap a target square.",target:"Point at a target square, then click.",target2:"Tap a target square to preview the path.",tapgo:"Tap the same square again to go.",nopath:"No empty path to there!",pop:(n,g)=>"Popped "+n+" balls! +"+g+" points",nt:"Next turn.",full:"Board full!",steps:n=>n+(n==1?" step":" steps"),over:"GAME OVER",rec:"New record!",play:"Play again",tb:"Ball Style",tg:"Board Style",use:"Use",buy:p=>"Buy "+p,inuse:"In use",owned:"Owned",price:p=>"Price: "+p+" points",poor:"Not enough balance.",bought:"Purchased!",name:"Player name",speed:"Ball movement speed",slow:"Slow",medium:"Medium",fast:"Fast",lang:"Language",snd:"Sound",on:"On",off:"Off",close:"Close",note:"Buying reduces your balance. Your best score is unchanged.",local:"Data is stored on this device only.",n_klasik:"Classic Balls",n_binatang:"Animal Series",n_tanaman:"Plant Series",n_standar:"Standard Board",n_grass:"Grass",n_land:"Land",n_cloud:"Clouds",roll:"rolls",walk:"walks",jump:"jumps",def:"Player"}};

/* ---- data lokal (localStorage, aman kalau diblokir) ---- */
const KEY="bolawarna.v1";
let P={name:"",best:0,bal:0,owned:["klasik"],th:"klasik",obg:["standar"],bg:"standar",spd:"medium",lang:/^en/i.test(navigator.language||"")?"en":"id",snd:true,view:"3d",rot:0};
try{const d=JSON.parse(localStorage.getItem(KEY)||"{}");if(d&&typeof d==="object"){  /* data lokal divalidasi: hanya kunci & nilai yang dikenal yang dipakai */
  const num=(v,m)=>Number.isFinite(v)?Math.min(Math.max(Math.floor(v),0),m):0,has=(T,k)=>typeof k==="string"&&Object.prototype.hasOwnProperty.call(T,k),ids=(a,T)=>Array.isArray(a)?a.filter(x=>has(T,x)):[];
  P.name=typeof d.name==="string"?d.name.slice(0,16):"";P.best=num(d.best,1e9);P.bal=num(d.bal,1e9);
  P.owned=[...new Set(["klasik",...ids(d.owned,TH)])];P.obg=[...new Set(["standar",...ids(d.obg,BG)])];
  P.th=P.owned.includes(d.th)?d.th:"klasik";P.bg=P.obg.includes(d.bg)?d.bg:"standar";
  if(has(SP,d.spd))P.spd=d.spd;if(d.lang==="id"||d.lang==="en")P.lang=d.lang;if(typeof d.snd==="boolean")P.snd=d.snd;
  if(d.view==="2d"||d.view==="3d")P.view=d.view;P.rot=num(d.rot,3)}}catch(e){}
/* save() didefinisikan di bagian akun lokal */
const tx=k=>TT[P.lang][k];

/* ---- suara ---- */
let AC;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(fs,d=.08,v=.12){if(!P.snd||!AC)return;const t0=AC.currentTime;fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(v,t0+i*d);g.gain.exponentialRampToValueAtTime(.001,t0+(i+1)*d);o.connect(g);g.connect(AC.destination);o.start(t0+i*d);o.stop(t0+(i+1)*d)})}

/* ---- util ---- */
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),E=x=>x*x*(3-2*x),rnd=n=>Math.floor(Math.random()*n),wait=ms=>new Promise(r=>setTimeout(r,ms));
const mixc=(h,t)=>{const n=parseInt(h.slice(1),16),f=t<0?0:255,k=Math.abs(t);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(f-v)*k)).join()+")"};
const seed=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---- logika game ---- */
let B,score,next,sel,pv,prev,over,busy,skip,newrec,msg,glow,mv,born={},pops=[],shards=[],floats=[];
const roll=()=>[rnd(4),rnd(4),rnd(4)];
function reset(){B=Array.from({length:G},()=>Array(G).fill(null));score=0;sel=pv=prev=glow=mv=null;over=false;newrec=false;born={};pops=[];shards=[];floats=[];next=roll();msg=()=>tx("start");spawn();busy=true;pop().then(()=>busy=false);$("#go").hidden=true}
function empties(){const e=[];for(let r=0;r<G;r++)for(let c=0;c<G;c++)if(B[r][c]===null)e.push([r,c]);return e}
function spawn(){const e=empties();for(let i=e.length-1;i>0;i--){const j=rnd(i+1);[e[i],e[j]]=[e[j],e[i]]}next.forEach((col,i)=>{if(e[i]){B[e[i][0]][e[i][1]]=col;born[e[i][0]*G+e[i][1]]=performance.now()}});next=roll();beep([247,294,370],.05,.09)}
function bfs(s){const p=new Map([[s[0]*G+s[1],null]]),q=[s];while(q.length){const[r,c]=q.shift();for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){const nr=r+dr,nc=c+dc,k=nr*G+nc;if(nr>=0&&nr<G&&nc>=0&&nc<G&&!p.has(k)&&B[nr][nc]===null){p.set(k,r*G+c);q.push([nr,nc])}}}return p}
function pathTo(p,r,c){const o=[];let k=r*G+c;while(k!==null&&k!==undefined){o.push([Math.floor(k/G),k%G]);k=p.get(k)}return o.reverse()}
function runs(){const out=[];for(let r=0;r<G;r++)for(let c=0;c<G;c++){const v=B[r][c];if(v===null)continue;for(const[dr,dc]of[[1,0],[0,1],[1,1],[1,-1]]){const pr=r-dr,pc=c-dc;if(pr>=0&&pr<G&&pc>=0&&pc<G&&B[pr][pc]===v)continue;const run=[[r,c]];let nr=r+dr,nc=c+dc;while(nr>=0&&nr<G&&nc>=0&&nc<G&&B[nr][nc]===v){run.push([nr,nc]);nr+=dr;nc+=dc}if(run.length>=3)out.push(run)}}return out}
const ptsOf=n=>n>=6?40:n===5?30:n===4?20:10,SND={10:[523,659,784],20:[523,659,784,1047],30:[523,659,784,1047,1319],40:[523,659,784,1047,1319,1568,2093]};
async function pop(){
  const rs=runs();if(!rs.length)return 0;
  const set=new Map();let g=0,top=0;
  for(const run of rs){g+=ptsOf(run.length);top=Math.max(top,run.length);run.forEach(([r,c])=>set.set(r*G+c,B[r][c]))}
  glow=set;beep([660,880,1100],.07,.1);await wait(SP[P.spd].h);glow=null;   /* terlihat utuh & menyala dulu */
  const now=performance.now();let sx=0,sy=0;
  for(const[k,col]of set){const r=Math.floor(k/G),c=k%G;B[r][c]=null;pops.push({r,c,col,t0:now});for(let i=0;i<10;i++){const a=Math.random()*6.28,s=1+Math.random()*2.4;shards.push({x:c+.5,y:r+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.6,col,t0:now})}sx+=c+.5;sy+=r+.5}
  score+=g;P.bal+=g;if(score>P.best){P.best=score;newrec=true}save();
  floats.push({t:"+"+g,x:sx/set.size,y:sy/set.size,t0:now});
  beep(SND[ptsOf(top)],ptsOf(top)>=40?.07:.06,.12);msg=()=>tx("pop")(set.size,g);return set.size}
async function turn(){await pop();spawn();await pop();if(!empties().length){over=true;sel=pv=prev=null;msg=()=>tx("full");beep([440,370,311,220],.18,.14);showOver()}else if(!msg)msg=()=>tx("nt")}
async function go(path){
  busy=true;skip=false;const[sr,sc]=path[0],col=B[sr][sc],st=TH[P.th].st,sp=SP[P.spd],n=path.length-1;
  const step=Math.max(50,Math.min(BASE[st]*sp.m,sp.cap/n));
  B[sr][sc]=null;sel=pv=prev=null;msg=null;beep([440,520],.04,.1);
  for(let i=0;i<n;i++)await new Promise(res=>{mv={a:path[i],b:path[i+1],dur:skip?step/4:step,st,col,i,t0:performance.now(),res}});
  const[er,ec]=path[n];mv=null;B[er][ec]=col;
  await turn();busy=false}

/* ---- tampilan papan ---- */
const bd=$("#bd"),ctx=bd.getContext("2d"),nx=$("#nx"),nctx=nx.getContext("2d");
let L=400,dpr=1,f=14,cell=37,bc=null;
const cx=c=>f+c*cell+cell/2,cy=r=>f+r*cell+cell/2;
function fit(){dpr=Math.min(window.devicePixelRatio||1,3);L=Math.floor(cl(Math.min(innerWidth-16,innerHeight-250,620),260,620));f=L*.035;cell=(L-2*f)/G;bd.width=bd.height=Math.round(L*dpr);bd.style.width=bd.style.height=L+"px";nx.width=Math.round(120*dpr);nx.height=Math.round(40*dpr);nx.style.width="120px";nx.style.height="40px";buildBoard()}
function buildBoard(){
  const s=BG[P.bg],o=document.createElement("canvas");o.width=o.height=Math.round(L*dpr);const g=o.getContext("2d");g.scale(dpr,dpr);
  const gr=g.createLinearGradient(0,0,0,L);gr.addColorStop(0,mixc(s.s,.2));gr.addColorStop(1,mixc(s.s,-.25));g.fillStyle=gr;g.fillRect(0,0,L,L);
  g.fillStyle="rgba(0,0,0,.3)";rr(g,f*.3+3,f*.3+6,L-f*.6,L-f*.6,L*.03);g.fill();
  g.fillStyle=s.f;rr(g,f*.3,f*.3,L-f*.6,L-f*.6,L*.03);g.fill();g.lineWidth=2;g.strokeStyle=mixc(s.f,.35);g.stroke();
  const rg=seed(P.bg.length*97+7);
  for(let r=0;r<G;r++)for(let c=0;c<G;c++){
    const x=f+c*cell,y=f+r*cell;g.fillStyle=(r+c)%2?s.b:s.a;g.fillRect(x,y,cell,cell);
    g.fillStyle="rgba(255,255,255,.22)";g.fillRect(x,y,cell,2);g.fillRect(x,y,2,cell);g.fillStyle="rgba(0,0,0,.2)";g.fillRect(x,y+cell-2,cell,2);g.fillRect(x+cell-2,y,2,cell);
    if(P.bg==="grass"){g.lineWidth=1.5;for(let k=0;k<4;k++){g.strokeStyle=mixc("#3f8f2f",rg()*.7);const px=x+4+rg()*(cell-8),py=y+cell*.4+rg()*cell*.5;g.beginPath();g.moveTo(px,py);g.lineTo(px+(rg()-.5)*4,py-cell*.16);g.stroke()}}
    else if(P.bg==="land"){for(let k=0;k<2;k++){g.fillStyle=mixc("#8a6a44",rg()*.5-.1);g.beginPath();g.ellipse(x+4+rg()*(cell-8),y+4+rg()*(cell-8),cell*.06,cell*.04,0,0,7);g.fill()}}
    else if(P.bg==="cloud"){g.fillStyle="#fff";for(let k=0;k<2;k++){g.beginPath();g.ellipse(x+cell*(.25+rg()*.5),y+cell*(.25+rg()*.5),cell*.2,cell*.1,0,0,7);g.fill()}}
    else{g.strokeStyle="rgba(0,0,0,.08)";g.beginPath();g.moveTo(x+3,y+cell*(.3+rg()*.4));g.lineTo(x+cell-3,y+cell*(.3+rg()*.4));g.stroke()}}
  bc=o}
function drawBall(g,x,y,r,col,th,o={}){
  g.save();g.globalAlpha=o.a===undefined?1:o.a;g.translate(x,y);if(o.tilt)g.rotate(o.tilt);const k=o.sc||1;g.scale((o.sx||1)*k,(o.sy||1)*k);
  const e=TH[th].e;
  if(!e){
    const gr=g.createRadialGradient(-r*.35,-r*.4,r*.08,0,0,r);gr.addColorStop(0,mixc(C[col],.75));gr.addColorStop(.45,C[col]);gr.addColorStop(1,mixc(C[col],-.5));
    g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=gr;g.fill();
    const d=o.dir||[1,0],ph=o.spin||0;
    for(let i=0;i<3;i++){const a=.5+i*2.094+ph,cz=Math.cos(a);if(cz>0){const p=r*.6*Math.sin(a);g.beginPath();g.arc(d[0]*p,d[1]*p,r*.17*cz,0,7);g.fillStyle="rgba(255,255,255,.7)";g.fill()}}
